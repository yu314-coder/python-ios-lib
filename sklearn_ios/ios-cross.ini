# Meson cross-file for scikit-learn → iOS arm64, using BeeWare's clang wrappers
# (arch + isysroot are baked into the wrappers). Python C-API symbols are left
# undefined and resolved at runtime from the app's Python (dynamic_lookup),
# matching the other bundled native libs (numpy/cv2/faiss).
[binaries]
c       = '/Volumes/D/OfflinAi/Frameworks/Python.xcframework/ios-arm64/bin/arm64-apple-ios-clang'
cpp     = '/Volumes/D/OfflinAi/Frameworks/Python.xcframework/ios-arm64/bin/arm64-apple-ios-clang++'
ar      = '/Volumes/D/OfflinAi/Frameworks/Python.xcframework/ios-arm64/bin/arm64-apple-ios-ar'
strip   = '/Volumes/D/OfflinAi/Frameworks/Python.xcframework/ios-arm64/bin/arm64-apple-ios-strip'

[host_machine]
system     = 'darwin'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
subsystem  = 'ios'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args        = ['-mios-version-min=13.0']
cpp_args      = ['-mios-version-min=13.0']
c_link_args   = ['-mios-version-min=13.0', '-undefined', 'dynamic_lookup']
cpp_link_args = ['-mios-version-min=13.0', '-undefined', 'dynamic_lookup']
